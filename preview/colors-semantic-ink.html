<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--font-body)}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:center;gap:18px}
  .label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7F7A6E;width:120px;flex:none}
  .sample{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
  .fg-1{color:var(--bone)}
  .fg-2{color:#BDB7A8}
  .fg-3{color:#7F7A6E}
  .accent{color:var(--volt)}
  .rule{height:1px;background:#22221F;flex:1}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="label">FG / 1</span><span class="sample fg-1">Primary text</span><span class="rule"></span><span class="label">#F2EDE2</span></div>
  <div class="row"><span class="label">FG / 2</span><span class="sample fg-2">Secondary</span><span class="rule"></span><span class="label">#BDB7A8</span></div>
  <div class="row"><span class="label">FG / 3</span><span class="sample fg-3">Tertiary · labels</span><span class="rule"></span><span class="label">#7F7A6E</span></div>
  <div class="row"><span class="label">Accent</span><span class="sample accent">Highlight CTA</span><span class="rule"></span><span class="label">--volt</span></div>
</div></body></html>
