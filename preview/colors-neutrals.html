<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:28px 32px}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:0;border-radius:6px;overflow:hidden;border:1px solid #D9D1BC}
  .cell{height:80px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em}
  .labels{display:grid;grid-template-columns:repeat(10,1fr);gap:0;margin-top:8px;font-family:var(--font-mono);font-size:10px;color:#6B6357;letter-spacing:.04em;text-align:center}
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="cell" style="background:#FAF7EE;color:#0B0B0B">50</div>
    <div class="cell" style="background:#EFEAE0;color:#0B0B0B">100</div>
    <div class="cell" style="background:#D9D1BC;color:#0B0B0B">200</div>
    <div class="cell" style="background:#B5AC97;color:#0B0B0B">300</div>
    <div class="cell" style="background:#8F8674;color:#fff">400</div>
    <div class="cell" style="background:#6B6357;color:#fff">500</div>
    <div class="cell" style="background:#4D463E;color:#fff">600</div>
    <div class="cell" style="background:#2F2B26;color:#fff">700</div>
    <div class="cell" style="background:#1A1815;color:#fff">800</div>
    <div class="cell" style="background:#0B0B0B;color:#fff">900</div>
  </div>
  <div class="labels">
    <div>50</div><div>100</div><div>200</div><div>300</div><div>400</div><div>500</div><div>600</div><div>700</div><div>800</div><div>900</div>
  </div>
</div></body></html>
