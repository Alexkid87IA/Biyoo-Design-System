<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--bone-3);padding-bottom:12px}
  .label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6B6357;width:96px;flex:none}
  .spec{font-family:var(--font-display);font-weight:700;letter-spacing:-.03em;line-height:1}
  .h1{font-size:56px}
  .h2{font-size:36px;font-weight:600;letter-spacing:-.025em}
  .h3{font-size:24px;font-weight:600;letter-spacing:-.02em}
  .lead{font-family:var(--font-body);font-size:20px;line-height:1.3;letter-spacing:-.01em;font-weight:400}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="label">H1 / 56</span><span class="spec h1">Du brief au final cut.</span></div>
  <div class="row"><span class="label">H2 / 36</span><span class="spec h2">On voit grand.</span></div>
  <div class="row"><span class="label">H3 / 24</span><span class="spec h3">Pré-prod · Prod · Post.</span></div>
  <div class="row" style="border:none"><span class="label">Lead / 20</span><span class="lead">Une maison qui couvre le pipeline complet — film, séries, social, IA.</span></div>
</div></body></html>
