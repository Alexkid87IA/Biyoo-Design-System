<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:24px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .demo{padding:18px;border-radius:8px;display:flex;flex-direction:column;gap:10px;min-height:170px;justify-content:space-between}
  .demo.ink{background:#0B0B0B;color:#F2EDE2}
  .demo.bone{background:#F2EDE2;color:#0B0B0B;border:1px solid #D9D1BC}
  .head{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.025em;line-height:1}
  .head .acc{color:var(--volt)}
  .head .acch{color:var(--heat)}
  .meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  .row{display:flex;gap:8px}
  .btn{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:4px}
  .btn-volt{background:var(--volt);color:#0B0B0B}
  .btn-heat{background:var(--heat);color:#F2EDE2}
</style></head>
<body><div class="wrap">
  <div class="demo ink">
    <div class="meta">Volt · use ≤ 10% surface</div>
    <div class="head">On voit <span class="acc">grand.</span></div>
    <div class="row"><span class="btn btn-volt">Voir le reel →</span></div>
  </div>
  <div class="demo bone">
    <div class="meta">Heat · alerts, REC, editorial</div>
    <div class="head"><span class="acch">Live</span> sur le set.</div>
    <div class="row"><span class="btn btn-heat">● REC</span></div>
  </div>
</div></body></html>
