<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--font-body)}
  .wrap{padding:36px 32px;display:flex;align-items:center;justify-content:center;gap:30px}
  .word{font-family:var(--font-display);font-weight:800;font-size:120px;letter-spacing:-.05em;line-height:.86;position:relative}
  .word .o{color:var(--volt);position:relative;display:inline-block}
  .reg{position:absolute;width:10px;height:1.5px;background:currentColor;left:50%;top:50%;transform:translate(-50%,-50%)}
  .reg2{position:absolute;height:10px;width:1.5px;background:currentColor;left:50%;top:50%;transform:translate(-50%,-50%)}
  .meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7F7A6E}
</style></head>
<body><div class="wrap">
  <div class="word">BIY<span class="o">O<span class="reg"></span><span class="reg2"></span></span><span class="o">O<span class="reg"></span><span class="reg2"></span></span></div>
  <div>
    <div class="meta" style="color:var(--bone)">Wordmark · primary</div>
    <div class="meta" style="margin-top:4px">Bricolage Grotesque 800 · -5% tracking</div>
    <div class="meta" style="margin-top:4px">Les deux O portent une mire centrale</div>
  </div>
</div></body></html>
