<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:28px 32px;display:flex;gap:22px;align-items:flex-start;justify-content:space-between}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:96px;height:96px;background:#0B0B0B;border:1.5px solid #0B0B0B}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:#6B6357;letter-spacing:.06em;text-transform:uppercase}
  .val{font-family:var(--font-mono);font-size:11px;color:#0B0B0B;letter-spacing:.04em}
</style></head>
<body><div class="wrap">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="lbl">Default</div><div class="val">0px</div></div>
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="lbl">XS</div><div class="val">2px</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl">SM · Chips</div><div class="val">4px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="lbl">MD</div><div class="val">8px</div></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><div class="lbl">LG · Cards</div><div class="val">14px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="lbl">Pill</div><div class="val">999px</div></div>
</div></body></html>
