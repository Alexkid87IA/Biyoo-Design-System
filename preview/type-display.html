<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--font-body);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;justify-content:center;min-height:180px}
  .big{font-family:var(--font-display);font-weight:800;font-size:128px;line-height:.86;letter-spacing:-.05em;font-variation-settings:"wdth" 92,"opsz" 96;}
  .big .volt{color:var(--volt)}
  .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7F7A6E}
</style></head>
<body><div class="wrap">
  <div class="big">BIY<span class="volt">OO</span>.</div>
  <div class="row">
    <div class="meta">Bricolage Grotesque · 128px · -5% tracking · wght 800</div>
    <div class="meta">DISPLAY / MEGA</div>
  </div>
</div></body></html>
