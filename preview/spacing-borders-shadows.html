<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--font-body)}
  .wrap{padding:24px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .item{display:flex;flex-direction:column;gap:10px}
  .demo{padding:14px;min-height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
  .a{background:#161614;border:1px solid #22221F}
  .b{background:#161614;border:1.5px solid #F2EDE2}
  .c{background:#161614;box-shadow:0 12px 32px -8px rgba(0,0,0,.6)}
  .d{background:#F2EDE2;color:#0B0B0B;box-shadow:0 1px 0 0 rgba(0,0,0,.04), 0 4px 12px -4px rgba(0,0,0,.08)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7F7A6E;display:flex;justify-content:space-between}
  .lbl b{color:var(--bone);font-weight:500}
  .d-lbl b{color:var(--bone)}
</style></head>
<body><div class="wrap">
  <div class="item"><div class="demo a">Hairline 1px</div><div class="lbl"><b>--rule</b><span>border-hairline</span></div></div>
  <div class="item"><div class="demo b">Strong 1.5px</div><div class="lbl"><b>--fg-1</b><span>border-strong</span></div></div>
  <div class="item"><div class="demo c">Shadow rare on ink</div><div class="lbl"><b>--shadow-2</b><span>modal only</span></div></div>
  <div class="item"><div class="demo d">Shadow on bone</div><div class="lbl"><b>--shadow-1</b><span>dropdowns</span></div></div>
</div></body></html>
