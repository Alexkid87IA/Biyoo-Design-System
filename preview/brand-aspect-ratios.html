<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:14px}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6B6357}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;align-items:start}
  .frame{position:relative;background:#0B0B0B;color:var(--bone);display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em}
  .frame .ar{position:absolute;right:8px;top:6px;color:#7F7A6E}
  .reg::before,.reg::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--bone);border-style:solid}
  .reg::before{top:-1px;left:-1px;border-width:1.5px 0 0 1.5px}
  .reg::after{bottom:-1px;right:-1px;border-width:0 1.5px 1.5px 0}
</style></head>
<body><div class="wrap">
  <div class="lbl">Aspect ratios — la grille compositionnelle de Biyoo</div>
  <div class="grid">
    <div class="frame reg" style="aspect-ratio:2.39/1"><span>Cinéma</span><span class="ar">2.39:1</span></div>
    <div class="frame reg" style="aspect-ratio:16/9"><span>Web</span><span class="ar">16:9</span></div>
    <div class="frame reg" style="aspect-ratio:1/1"><span>Carré</span><span class="ar">1:1</span></div>
    <div class="frame reg" style="aspect-ratio:9/16"><span>Vertical</span><span class="ar">9:16</span></div>
  </div>
</div></body></html>
