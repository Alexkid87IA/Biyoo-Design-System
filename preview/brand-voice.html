<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:16px}
  .quote{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.2;max-width:560px}
  .row{display:flex;gap:18px}
  .ex{flex:1;display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid #D9D1BC}
  .ex.bad{border-color:#FF3F1F}
  .ex.good{border-color:#0B0B0B}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .ex.good .tag{color:#0B0B0B}
  .ex.bad .tag{color:#FF3F1F}
  .ex p{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.45}
</style></head>
<body><div class="wrap">
  <div class="quote">"Du brief au final cut, sans détour."</div>
  <div class="row">
    <div class="ex good"><div class="tag">✓ Biyoo</div><p>On voit grand. Tu viens.</p></div>
    <div class="ex bad"><div class="tag">✗ Pas Biyoo</div><p>Découvrez nos solutions audiovisuelles premium. 🎬✨</p></div>
  </div>
</div></body></html>
