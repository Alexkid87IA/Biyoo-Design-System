<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:14px}
  .row{display:grid;grid-template-columns:80px 1fr auto;gap:18px;border-top:1px solid #D9D1BC;padding-top:14px;align-items:start}
  .row:first-child{border-top:none;padding-top:0}
  .n{font-family:var(--font-display);font-weight:700;font-size:48px;letter-spacing:-.04em;line-height:.9}
  .name{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1}
  .desc{font-family:var(--font-body);font-size:13px;color:#3A3530;line-height:1.4;margin-top:4px;max-width:380px}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6B6357}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="n">01</span><div><div class="name">Film</div><div class="desc">Long, court, doc, clip. Du pitch à la première.</div></div><span class="tag">DCP · 4K</span></div>
  <div class="row"><span class="n">02</span><div><div class="name">Séries</div><div class="desc">Concept, écriture, pilote, saison complète.</div></div><span class="tag">Streaming · TV</span></div>
  <div class="row"><span class="n">03</span><div><div class="name">Social</div><div class="desc">Reels, TikTok, capsules. Vertical-first, livré rapide.</div></div><span class="tag">9:16</span></div>
  <div class="row"><span class="n">04</span><div><div class="name">IA</div><div class="desc">Photo &amp; vidéo génératives — qualité plateau, sans le plateau.</div></div><span class="tag">Gen-AI</span></div>
</div></body></html>
