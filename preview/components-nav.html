<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--font-body)}
  .wrap{padding:18px 28px;display:flex;flex-direction:column;gap:14px}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:1px solid #22221F;backdrop-filter:blur(24px);background:rgba(11,11,11,.65)}
  .brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.04em}
  .brand .o{color:var(--volt)}
  .links{display:flex;gap:18px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#BDB7A8}
  .links a{color:inherit;text-decoration:none}
  .links a.on{color:var(--bone)}
  .cta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--volt);color:var(--ink);padding:8px 12px}
  .breadcrumb{display:flex;gap:10px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7F7A6E;padding:0 18px}
  .breadcrumb b{color:var(--bone);font-weight:500}
</style></head>
<body><div class="wrap">
  <div class="nav">
    <div class="brand">BIY<span class="o">OO</span></div>
    <div class="links"><a class="on">Projets</a><a>Services</a><a>À propos</a><a>Contact</a></div>
    <div class="cta">Brief →</div>
  </div>
  <div class="breadcrumb"><span>Projets</span><span>/</span><b>Hors-saison</b><span>/</span><span>04 sur 12</span></div>
</div></body></html>
