<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:24px 32px;display:flex;align-items:center;gap:28px;justify-content:space-between}
  .lock{display:flex;flex-direction:column;align-items:center;gap:10px}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6B6357}
  .mono{width:140px;height:140px;background:#0B0B0B;display:flex;align-items:center;justify-content:center;position:relative;color:var(--volt);font-family:var(--font-display);font-weight:800;font-size:120px;letter-spacing:-.06em;line-height:1}
  .mono::before,.mono::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--volt);border-style:solid}
  .mono::before{top:6px;left:6px;border-width:2px 0 0 2px}
  .mono::after{bottom:6px;right:6px;border-width:0 2px 2px 0}
  .stamp{width:140px;height:140px;border-radius:50%;border:1.5px solid #0B0B0B;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:90px;letter-spacing:-.06em;position:relative}
  .stamp::before{content:"BIYOO · PARIS · EST. 2026 · MAISON DE PRODUCTION ·";position:absolute;inset:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.5em;text-transform:uppercase;display:none}
  .stamp-ring{width:140px;height:140px;position:absolute}
</style></head>
<body><div class="wrap">
  <div class="lock"><div class="mono">B</div><div class="lbl">Monogramme · 1:1</div></div>
  <div class="lock">
    <svg width="140" height="140" viewBox="0 0 360 360">
      <defs><path id="c" d="M 180,180 m -140,0 a 140,140 0 1,1 280,0 a 140,140 0 1,1 -280,0"/></defs>
      <circle cx="180" cy="180" r="172" fill="none" stroke="#0B0B0B" stroke-width="2"/>
      <circle cx="180" cy="180" r="146" fill="none" stroke="#0B0B0B" stroke-width="1"/>
      <text font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="5" fill="#0B0B0B">
        <textPath href="#c" startOffset="0">BIYOO · PARIS · MAISON DE PRODUCTION · EST. 2026 · </textPath>
      </text>
      <text x="180" y="222" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="180" letter-spacing="-12" fill="#0B0B0B">B</text>
    </svg>
    <div class="lbl">Tampon · sceau</div>
  </div>
  <div class="lock">
    <div style="display:flex;gap:8px;align-items:center;height:140px">
      <div style="background:#0B0B0B;color:#D8FF36;padding:14px 18px;font-family:Bricolage Grotesque,sans-serif;font-weight:800;font-size:64px;letter-spacing:-.06em;line-height:1">B</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6B6357">BIYOO</div>
        <div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6B6357">PARIS</div>
        <div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6B6357">EST. 2026</div>
      </div>
    </div>
    <div class="lbl">Lockup · horizontal</div>
  </div>
</div></body></html>
