<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--font-body)}
  .wrap{padding:28px 32px;display:flex;align-items:flex-end;gap:10px;overflow:hidden}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
  .box{background:#0B0B0B;width:24px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:#6B6357;letter-spacing:.04em}
  .val{font-family:var(--font-mono);font-size:9px;color:#8F8674;letter-spacing:.04em}
</style></head>
<body><div class="wrap">
  <div class="col"><div class="box" style="height:4px"></div><div class="lbl">1</div><div class="val">4</div></div>
  <div class="col"><div class="box" style="height:8px"></div><div class="lbl">2</div><div class="val">8</div></div>
  <div class="col"><div class="box" style="height:12px"></div><div class="lbl">3</div><div class="val">12</div></div>
  <div class="col"><div class="box" style="height:16px"></div><div class="lbl">4</div><div class="val">16</div></div>
  <div class="col"><div class="box" style="height:24px"></div><div class="lbl">5</div><div class="val">24</div></div>
  <div class="col"><div class="box" style="height:32px"></div><div class="lbl">6</div><div class="val">32</div></div>
  <div class="col"><div class="box" style="height:48px"></div><div class="lbl">7</div><div class="val">48</div></div>
  <div class="col"><div class="box" style="height:64px"></div><div class="lbl">8</div><div class="val">64</div></div>
  <div class="col"><div class="box" style="height:96px"></div><div class="lbl">9</div><div class="val">96</div></div>
  <div class="col"><div class="box" style="height:128px"></div><div class="lbl">10</div><div class="val">128</div></div>
  <div class="col"><div class="box" style="height:192px"></div><div class="lbl">11</div><div class="val">192</div></div>
</div></body></html>
